<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Apply: Programme Manager - Hollins Rail (fictional)</title>
  <link rel="stylesheet" href="fixture.css">
  <script src="queue.js"></script>
</head>
<body>
  <header class="site"><strong>Programme Manager - Hollins Rail (fictional)</strong><p>Fictional employer. CV upload test fixture for OpennJob.</p></header>
  <form id="apply" action="#" method="post" data-name="cv" data-after="thanks">
    <label for="q-first">First name</label><input type="text" id="q-first" name="firstName" autocomplete="given-name" required>
    <label for="q-last">Last name</label><input type="text" id="q-last" name="lastName" autocomplete="family-name" required>
    <label for="q-email">Email</label><input type="email" id="q-email" name="email" required>
    <label for="q-phone">Phone</label><input type="tel" id="q-phone" name="phone" required>
    <label for="q-cv">Resume/CV</label><input type="file" id="q-cv" name="resume" accept=".pdf,.doc,.docx" required>

    <label for="q-statement">Supporting statement</label><textarea id="q-statement" name="statement" required></textarea>
    <p><button type="submit" id="q-submit">Submit application</button></p>
  </form>
</body>
</html>
