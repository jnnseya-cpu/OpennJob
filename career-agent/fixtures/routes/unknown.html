<!doctype html><html lang="en"><meta charset="utf-8"><title>LOCAL TEST — not an employer</title><h1>LOCAL TEST — not an employer</h1>
<section id="jd">Construction delivery leadership and contractor governance.</section>
<form id="apply" method="post" action="/submit/unknown" enctype="multipart/form-data">
<label for="name">Full name</label><input id="name" name="name" required>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="notice">Notice period</label><input id="notice" name="notice" required>
<label for="salary">Expected salary (GBP)</label><input id="salary" name="salary" required>
<label for="earliest">Start date of your earliest role</label><input id="earliest" name="earliest" required>
<label for="cv">CV (PDF)</label><input id="cv" name="cv" type="file" required accept="application/pdf">
<button id="send" type="submit">Submit application</button>
</form></html>
